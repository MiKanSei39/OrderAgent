[project]
name = "orderagent"
version = "0.1.0"
description = "我的智能点餐系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-huggingface>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pymilvus>=3.0.2",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
orderagent = "orderagent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
